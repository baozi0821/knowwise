name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  notices:
    name: Third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run notices
      - run: git diff --exit-code -- NOTICE

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Migration SQL line endings
        if: runner.os == 'Windows'
        run: |
          git ls-files --eol src-tauri/migrations
          if git ls-files --eol src-tauri/migrations | grep -E 'w/crlf|w/mixed'; then
            echo "::error::src-tauri/migrations must be checked out with LF line endings"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Formatting
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Clippy (desktop + local translation)
        working-directory: src-tauri
        run: cargo clippy --all-targets --features desktop -- -D warnings
      - name: Core tests
        working-directory: src-tauri
        run: cargo test
      - name: Local translation tests
        working-directory: src-tauri
        run: cargo test --features local-mt
      - name: Desktop-feature tests (macOS)
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: cargo test --features desktop

  desktop:
    name: Desktop bundle (${{ matrix.os }})
    needs: [frontend, rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            bundles: nsis,msi
          - os: macos-latest
            label: macos-arm64
            bundles: app,dmg
          - os: macos-15-intel
            label: macos-x64
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Migration SQL line endings
        if: runner.os == 'Windows'
        run: |
          git ls-files --eol src-tauri/migrations
          if git ls-files --eol src-tauri/migrations | grep -E 'w/crlf|w/mixed'; then
            echo "::error::src-tauri/migrations must be checked out with LF line endings"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build installers
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - name: Verify macOS bundle
        if: runner.os == 'macOS'
        run: |
          APP=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          echo "App bundle: $APP"
          lipo -archs "$APP/Contents/MacOS/knowwise"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          DMG=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -1)
          test -n "$DMG"
          hdiutil verify "$DMG"
          # ad-hoc 签名未公证时 spctl 预期失败;记录但不让构建因此失败。
          spctl -a -vv "$APP" 2>&1 | tee "$RUNNER_TEMP/spctl.txt" || true
      - name: Checksums
        run: |
          node scripts/checksums.mjs src-tauri/target/release/bundle
          mv src-tauri/target/release/bundle/SHA256SUMS.txt "src-tauri/target/release/bundle/SHA256SUMS-${{ matrix.label }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: knowwise-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/SHA256SUMS-*.txt
          if-no-files-found: error
