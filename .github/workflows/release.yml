name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            bundles: nsis,msi
          - os: macos-latest
            label: macos-arm64
            bundles: app,dmg
          - os: macos-15-intel
            label: macos-x64
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Configure macOS signing (optional)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            {
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
              [ -n "$APPLE_CERTIFICATE" ] && echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              [ -n "$APPLE_ID" ] && echo "APPLE_ID=$APPLE_ID"
              [ -n "$APPLE_PASSWORD" ] && echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              [ -n "$APPLE_TEAM_ID" ] && echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
              [ -n "$APPLE_API_ISSUER" ] && echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
              [ -n "$APPLE_API_KEY" ] && echo "APPLE_API_KEY=$APPLE_API_KEY"
            } >> "$GITHUB_ENV"
            if [ -n "$APPLE_API_KEY_P8" ]; then
              printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
              echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
            fi
            echo "macOS signing: Developer ID configured"
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "macOS signing: ad-hoc (no Developer ID secrets)"
          fi
      - name: Build installers
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - name: Verify macOS bundle
        if: runner.os == 'macOS'
        run: |
          APP=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          echo "App bundle: $APP"
          lipo -archs "$APP/Contents/MacOS/knowwise"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          DMG=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -1)
          test -n "$DMG"
          hdiutil verify "$DMG"
          if [ -n "$APPLE_SIGNING_IDENTITY" ] && [ "$APPLE_SIGNING_IDENTITY" != "-" ]; then
            spctl -a -vv "$APP"
            xcrun stapler validate "$APP" || xcrun stapler validate "$DMG"
          else
            # ad-hoc 未公证时 spctl 预期失败;记录但不阻断发布。
            spctl -a -vv "$APP" 2>&1 | tee "$RUNNER_TEMP/spctl.txt" || true
          fi
      - name: Checksums
        run: |
          node scripts/checksums.mjs src-tauri/target/release/bundle
          mv src-tauri/target/release/bundle/SHA256SUMS.txt "src-tauri/target/release/bundle/SHA256SUMS-${{ matrix.label }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/SHA256SUMS-*.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: List release assets
        run: find release-assets -maxdepth 3 -type f -printf '%p %s bytes\n'
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            Knowwise ${{ github.ref_name }}.

            ## Downloads

            - **Windows x64:** NSIS installer and MSI package.
            - **macOS 13+ (Apple Silicon):** the `aarch64` DMG.
            - **macOS 13+ (Intel):** the `x64` DMG.
            - **Checksums:** `SHA256SUMS-windows-x64.txt`, `SHA256SUMS-macos-arm64.txt`, `SHA256SUMS-macos-x64.txt`.

            ## OCR

            - **Incremental, page-scoped OCR.** Recognizing additional pages or ranges never discards pages that are already recognized; status, text, blocks, confidence and corrections are preserved.
            - **Range requests are idempotent by default.** Asking for pages 1–10 after pages 1–3 only processes 4–10. Repeating 1–3 is a no-op. Use “重新识别已识别页” to force a re-run; block IDs are preserved.
            - **Automatic OCR is on by default** for pages without a text layer (Settings → App). It runs locally with Tesseract, with real page-level progress, pause/resume and cancel. No document content or page images leave the machine.
            - Zero-text pages are shown as failed/missing, not as “already covered”; low-confidence pages are marked for review.

            ## macOS signing

            macOS builds are **ad-hoc signed** so the app bundle is sealed; they are **not notarized** unless this release was built with Developer ID credentials. On first launch, use right-click → Open, or System Settings → Privacy & Security → Open Anyway. Do not disable Gatekeeper globally. Use the `aarch64` DMG on Apple Silicon and the `x64` DMG on Intel Macs.

            ## Upgrade

            v0.1.2 keeps the same bundle identifier and data directories. Installing over v0.1.0 or v0.1.1 keeps the existing library, indexes, notes and settings. Migration checksums are now line-ending independent: databases written by the LF-built v0.1.0/v0.1.1 installers and by the CRLF-built v0.1.1 Windows installer are both accepted. No migration record, database or user data is rewritten.

            ## Configuration

            Model-backed features require an OpenAI-compatible provider or a local Ollama instance, configured in Settings. API keys are stored in the operating system credential store. Without a provider, reading, search, OCR, notes, bookmarks, the knowledge graph and local translation remain available.

            ## Optional local translation

            The OPUS-MT ONNX models and ONNX Runtime are **not** bundled in the installers. From a source checkout, install them with:

            ```bash
            npm run models:install
            ```

            The installer verifies pinned SHA-256 hashes and writes only into the Knowwise data directory. See the README for model licenses (CC-BY-4.0) and platform support. The desktop installers themselves do not require Node.js; the local translation download is an optional source-checkout step.

            ## Notes

            - No model weights, API keys or user data are included in this release.
            - macOS artifacts are built by GitHub Actions for both arm64 and x64. CI verifies the DMG, code signature and Mach-O architecture; macOS UI launch and native OCR are not exercised by GitHub-hosted CI, so those remain unverified unless tested on a Mac.
            - See the README for known limitations and troubleshooting.
          files: release-assets/**/*
          fail_on_unmatched_files: true
          generate_release_notes: false
